<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="spaceBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="70%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="orbitGrad1" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#2563eb" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Sphere -->
  <circle cx="64" cy="64" r="60" fill="url(#spaceBase)"/>
  <circle cx="64" cy="64" r="59" stroke="url(#orbitGrad1)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Outer Telemetry Tick Marks -->
  <circle cx="64" cy="64" r="52" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2 6" stroke-opacity="0.4"/>
  <circle cx="64" cy="64" r="44" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="12 18" stroke-opacity="0.5"/>

  <!-- Tilted Orbital Rings -->
  <ellipse cx="64" cy="64" rx="42" ry="18" stroke="url(#orbitGrad1)" stroke-width="2.5" transform="rotate(-30 64 64)" filter="url(#neonBlur)"/>
  <ellipse cx="64" cy="64" rx="42" ry="18" stroke="url(#orbitGrad2)" stroke-width="2" transform="rotate(35 64 64)" filter="url(#neonBlur)" stroke-opacity="0.85"/>

  <!-- Orbital Satellites / Nodes -->
  <circle cx="34" cy="46" r="3" fill="#ffffff" filter="url(#neonBlur)"/>
  <circle cx="94" cy="82" r="2.5" fill="#00f0ff" filter="url(#neonBlur)"/>
  <circle cx="38" cy="84" r="2" fill="#a855f7"/>
  <circle cx="90" cy="44" r="2.5" fill="#38bdf8"/>

  <!-- Radiant Singularity Center -->
  <circle cx="64" cy="64" r="22" fill="url(#coreGlow)"/>
  <!-- Quantum Core Facet / Prism -->
  <polygon points="64,48 76,64 64,80 52,64" fill="none" stroke="#ffffff" stroke-width="1.8" filter="url(#neonBlur)"/>
  <polygon points="64,53 72,64 64,75 56,64" fill="#38bdf8" fill-opacity="0.4" stroke="#00f0ff" stroke-width="1"/>
  <circle cx="64" cy="64" r="3" fill="#ffffff"/>
</svg>
